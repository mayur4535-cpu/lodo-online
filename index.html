<script>
let roomCode="";
let isHost=false;

function showOnline(){
document.getElementById("modeScreen").classList.remove("active");
document.getElementById("onlineScreen").classList.add("active");
}

function startOffline(){
document.getElementById("modeScreen").innerHTML=`
<div class="title">OFFLINE ui1</div>
<div class="wait">Paste your ui1 offline code here</div>
`;
}

function randomCode(){
return Math.random().toString(36).substring(2,6).toUpperCase();
}

async function createRoom(){

roomCode=randomCode();
isHost=true;

document.getElementById("roomText").innerHTML="ROOM : "+roomCode;
document.getElementById("waitText").innerHTML="WAITING FOR PLAYER...";

await firebaseSet(
firebaseRef(firebaseDB,"rooms/"+roomCode),
{
player1:true,
player2:false,
turn:"red",
dice:1
});

firebaseOnValue(
firebaseRef(firebaseDB,"rooms/"+roomCode),
(snapshot)=>{

let data=snapshot.val();

if(data && data.player2){

startOnlineGame();

}
});
}

async function joinRoom(){

roomCode=document.getElementById("roomCodeInput").value.toUpperCase();

if(!roomCode)return;

let snap=await firebaseGet(
firebaseRef(firebaseDB,"rooms/"+roomCode)
);

if(snap.exists()){

await firebaseSet(
firebaseRef(firebaseDB,"rooms/"+roomCode+"/player2"),
true
);

startOnlineGame();

}else{

alert("ROOM NOT FOUND");

}
}

function startOnlineGame(){

document.getElementById("onlineScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

}
</script>
